<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bowbert Bow Tuning</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111712;
      --panel: #1b241d;
      --panel-2: #243025;
      --line: #415041;
      --text: #eef3e7;
      --muted: #aebba8;
      --accent: #f0c45b;
      --ok: #80c77a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      padding: 18px;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .topbar {
      max-width: 1480px;
      margin: 0 auto 14px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .hint {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(330px, 0.8fr) minmax(520px, 1.1fr) 380px;
      gap: 14px;
      max-width: 1480px;
      margin: 0 auto;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
    }

    .panel-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .panel-meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .stage {
      min-height: 600px;
      display: grid;
      place-items: center;
      padding: 18px;
      background:
        linear-gradient(45deg, rgba(255, 255, 255, 0.04) 25%, transparent 25%) 0 0 / 22px 22px,
        linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.04) 75%) 0 0 / 22px 22px,
        linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.04) 75%) 11px 11px / 22px 22px,
        linear-gradient(45deg, rgba(255, 255, 255, 0.04) 25%, transparent 25%) 11px 11px / 22px 22px,
        #152017;
    }

    .reference-frame {
      width: min(100%, 620px);
      display: grid;
      place-items: center;
    }

    .reference-frame img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.24);
    }

    canvas {
      width: 100%;
      max-width: 680px;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.24);
      touch-action: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .controls {
      display: grid;
      gap: 12px;
      padding: 12px;
    }

    .field {
      display: grid;
      grid-template-columns: 112px 1fr 72px;
      gap: 9px;
      align-items: center;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    input[type="number"] {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #121912;
      color: var(--text);
      padding: 5px 6px;
      text-align: right;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #2b382c;
      color: var(--text);
      padding: 7px 10px;
      cursor: pointer;
    }

    button:hover {
      border-color: #6f806f;
      background: #334432;
    }

    button.active {
      border-color: var(--accent);
      background: #4b4224;
      color: #fff2c8;
    }

    .copy-button {
      width: 100%;
      border-color: #76602a;
      background: #4a3b20;
      color: #ffe7a3;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 230px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #101610;
      color: #e9f2df;
      padding: 10px;
      line-height: 1.45;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
    }

    .status {
      min-height: 18px;
      color: var(--ok);
      font-size: 12px;
    }

    .small-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    @media (max-width: 1220px) {
      .layout {
        grid-template-columns: 1fr 1fr;
      }

      .controls-panel {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 840px) {
      body {
        padding: 12px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Bowbert Bow Tuning</h1>
    <p class="hint">拖动预览里的弓可以微调偏移。右侧滑杆控制大小、距离、角度和拉弓预览，参数会实时更新。</p>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">Reference</div>
        <div class="panel-meta">original crop</div>
      </div>
      <div class="stage">
        <div class="reference-frame">
          <img src="asset-crops/player/bowbert_close_reference.png" alt="Original Bowbert reference">
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">Generated Body + Uproot Bow</div>
        <div class="panel-meta">canvas bow tuning</div>
      </div>
      <div class="stage">
        <canvas id="preview" width="680" height="620" aria-label="Bow tuning preview"></canvas>
      </div>
    </section>

    <aside class="panel controls-panel">
      <div class="panel-head">
        <div class="panel-title">Controls</div>
        <div class="panel-meta">copy params back</div>
      </div>
      <div class="controls">
        <div class="field">
          <label for="scaleRange">Scale</label>
          <input id="scaleRange" type="range" min="0.080" max="0.420" step="0.001">
          <input id="scaleNumber" type="number" min="0.08" max="0.42" step="0.001">
        </div>

        <div class="field">
          <label for="distanceRange">Distance</label>
          <input id="distanceRange" type="range" min="0" max="95" step="0.1">
          <input id="distanceNumber" type="number" min="0" max="95" step="0.1">
        </div>

        <div class="field">
          <label for="yDistanceRange">Y distance</label>
          <input id="yDistanceRange" type="range" min="0" max="85" step="0.1">
          <input id="yDistanceNumber" type="number" min="0" max="85" step="0.1">
        </div>

        <div class="field">
          <label for="offsetXRange">Offset X</label>
          <input id="offsetXRange" type="range" min="-80" max="80" step="0.1">
          <input id="offsetXNumber" type="number" min="-80" max="80" step="0.1">
        </div>

        <div class="field">
          <label for="offsetYRange">Offset Y</label>
          <input id="offsetYRange" type="range" min="-80" max="60" step="0.1">
          <input id="offsetYNumber" type="number" min="-80" max="60" step="0.1">
        </div>

        <div class="field">
          <label for="rotationRange">Angle offset</label>
          <input id="rotationRange" type="range" min="-45" max="45" step="0.1">
          <input id="rotationNumber" type="number" min="-45" max="45" step="0.1">
        </div>

        <div class="field">
          <label for="aimRange">Preview aim</label>
          <input id="aimRange" type="range" min="-180" max="180" step="1">
          <input id="aimNumber" type="number" min="-180" max="180" step="1">
        </div>

        <div class="field">
          <label for="drawRange">Preview draw</label>
          <input id="drawRange" type="range" min="0" max="1" step="0.001">
          <input id="drawNumber" type="number" min="0" max="1" step="0.001">
        </div>

        <div class="field">
          <label for="recoilRange">Preview recoil</label>
          <input id="recoilRange" type="range" min="0" max="1" step="0.001">
          <input id="recoilNumber" type="number" min="0" max="1" step="0.001">
        </div>

        <div class="button-row">
          <button type="button" id="aim-left">Left</button>
          <button type="button" id="aim-right" class="active">Right</button>
          <button type="button" id="reset">Reset</button>
        </div>

        <textarea id="output" spellcheck="false" aria-label="Generated bow tuning parameters"></textarea>
        <button class="copy-button" type="button" id="copy">Copy params</button>
        <div class="status" id="status"></div>
        <div class="small-note">导出的 scale/distance/offset/rotation 会用于游戏里的 Phaser CanvasTexture 弓；Preview draw/recoil/aim 只用于本页预览。</div>
      </div>
    </aside>
  </main>

  <script>
    const BODY_SCALE = 0.12;
    const PREVIEW_ZOOM = 3.55;
    const BODY_Y = -14;
    const BODY_SIZE = { width: 654, height: 714 };
    const BOW_TEXTURE = { width: 360, height: 420, anchorX: 180, anchorY: 210, drawScale: 0.58 };
    const EYE_TUNING = {
      eyes: {
        left: { x: 0.9403, y: 0.6001, outerRadius: 0.167, whiteRatio: 0.802, pupilRatio: 0.52 },
        right: { x: 0.0999, y: 0.6001, outerRadius: 0.167, whiteRatio: 0.802, pupilRatio: 0.52 }
      },
      pupilOffsetScale: { x: 0.165, y: 0.11 }
    };
    const initialState = {
      placement: {
        scale: 0.22,
        distance: 50,
        yDistance: 40,
        offsetX: 0,
        offsetY: -15,
        rotationOffsetDeg: -7,
        drawDistance: 5,
        releaseKick: 7,
        recoilDistance: 8,
        recoilY: 5
      },
      preview: {
        aimDeg: 0,
        draw: 0.56,
        recoil: 0
      }
    };

    const state = structuredClone(initialState);
    const canvas = document.getElementById("preview");
    const ctx = canvas.getContext("2d");
    const bodyImage = new Image();
    bodyImage.src = "../assets/characters/bowbert/bowbert-body-skill-v1-trimmed.png";
    const bowCanvas = document.createElement("canvas");
    bowCanvas.width = BOW_TEXTURE.width;
    bowCanvas.height = BOW_TEXTURE.height;
    const bowCtx = bowCanvas.getContext("2d");
    const outputEl = document.getElementById("output");
    const statusEl = document.getElementById("status");
    let drag = null;
    let statusTimer = 0;

    const LEAF_TIP_TOP = new Path2D("M-18 0 C-46 -30 -35 -61 5 -63 C22 -36 18 -15 -18 0Z");
    const LEAF_TIP_BOTTOM = new Path2D("M-18 0 C-46 30 -35 61 5 63 C22 36 18 15 -18 0Z");
    const ARROW_TAIL_TOP = new Path2D("M-136 0 C-169 -25 -190 -28 -213 -22 C-193 3 -167 9 -136 0Z");
    const ARROW_TAIL_BOTTOM = new Path2D("M-136 0 C-169 25 -190 28 -213 22 C-193 -3 -167 -9 -136 0Z");
    const ARROW_TAIL_TOP_MARK = new Path2D("M-139 0 C-160 -9 -181 -14 -204 -18");
    const ARROW_TAIL_BOTTOM_MARK = new Path2D("M-139 0 C-160 9 -181 14 -204 18");
    const BRANCH_LIMB = new Path2D("M48 -166 C132 -125 150 -55 98 0 C151 61 125 127 47 166");
    const BRANCH_MARK_TOP = new Path2D("M92 -101 C70 -88 63 -70 71 -51");
    const BRANCH_MARK_BOTTOM = new Path2D("M113 42 C88 55 80 76 90 99");
    const BRANCH_GRIP = new Path2D("M79 -24 C101 -14 105 16 80 28");
    const BOW_CHARGE_ARC = new Path2D("M64 -158 C142 -122 157 -58 105 0 C157 58 142 122 64 158");

    const fields = {
      scale: [document.getElementById("scaleRange"), document.getElementById("scaleNumber")],
      distance: [document.getElementById("distanceRange"), document.getElementById("distanceNumber")],
      yDistance: [document.getElementById("yDistanceRange"), document.getElementById("yDistanceNumber")],
      offsetX: [document.getElementById("offsetXRange"), document.getElementById("offsetXNumber")],
      offsetY: [document.getElementById("offsetYRange"), document.getElementById("offsetYNumber")],
      rotationOffsetDeg: [document.getElementById("rotationRange"), document.getElementById("rotationNumber")],
      aimDeg: [document.getElementById("aimRange"), document.getElementById("aimNumber")],
      draw: [document.getElementById("drawRange"), document.getElementById("drawNumber")],
      recoil: [document.getElementById("recoilRange"), document.getElementById("recoilNumber")]
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function round(value) {
      return Number(value.toFixed(4));
    }

    function setupStroke(context, width, color, alpha = 1) {
      context.strokeStyle = color;
      context.lineWidth = width;
      context.globalAlpha = alpha;
      context.lineCap = "round";
      context.lineJoin = "round";
    }

    function strokePath(context, path, stroke = "#070707", strokeWidth = 8, alpha = 1) {
      context.save();
      setupStroke(context, strokeWidth, stroke, alpha);
      context.stroke(path);
      context.restore();
    }

    function fillAndStrokePath(context, path, fill, stroke = "#070707", strokeWidth = 8, alpha = 1) {
      context.save();
      context.globalAlpha = alpha;
      context.fillStyle = fill;
      context.strokeStyle = stroke;
      context.lineWidth = strokeWidth;
      context.lineCap = "round";
      context.lineJoin = "round";
      context.fill(path);
      context.stroke(path);
      context.restore();
    }

    function cubicPath(start, c1, c2, end) {
      const path = new Path2D();
      path.moveTo(start.x, start.y);
      path.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, end.x, end.y);
      return path;
    }

    function drawProceduralBranchBow(context, options) {
      const draw = clamp(options.draw, 0, 1);
      const recoil = clamp(options.recoil, 0, 1);
      const fullDraw = clamp((draw - 0.82) / 0.18, 0, 1);

      context.clearRect(0, 0, BOW_TEXTURE.width, BOW_TEXTURE.height);
      context.save();
      context.translate(BOW_TEXTURE.anchorX + recoil * 8, BOW_TEXTURE.anchorY);
      context.scale(BOW_TEXTURE.drawScale, BOW_TEXTURE.drawScale);

      context.save();
      context.fillStyle = "#fff2ad";
      context.globalAlpha = 0.045 + draw * 0.075;
      context.beginPath();
      context.ellipse(28, 0, 178 + draw * 24, 214 + draw * 18, 0, 0, Math.PI * 2);
      context.fill();
      context.restore();

      drawBranchLimb(context);
      drawBowChargeArc(context, draw, fullDraw, options.timeSeconds);
      drawBowString(context, draw, fullDraw);

      if (options.showArrow && draw > 0.08) {
        drawArrowProjectile(context, 124 - draw * 176, 1, 0.78 + draw * 0.08 + fullDraw * 0.02);
      }

      if (draw > 0) {
        const nockX = 60 - draw * 136;
        const readyPulse = fullDraw >= 1 ? 0.65 + Math.sin(options.timeSeconds * 18) * 0.35 : 0;
        context.save();
        context.globalAlpha = 0.38 + draw * 0.32 + fullDraw * 0.24;
        context.fillStyle = "#fff2ad";
        context.beginPath();
        context.arc(nockX, 1, 4 + draw * 5 + fullDraw * 2, 0, Math.PI * 2);
        context.fill();
        if (fullDraw > 0) {
          setupStroke(context, 4, "#fff2ad", 0.16 + fullDraw * 0.34 + readyPulse * 0.28);
          context.beginPath();
          context.arc(nockX, 1, 14 + fullDraw * 10 + readyPulse * 6, 0, Math.PI * 2);
          context.stroke();
        }
        if (readyPulse > 0) {
          drawSparkle(context, nockX - 18, -14, 10 + readyPulse * 6, options.timeSeconds * 1.4, 0.62 + readyPulse * 0.32);
          drawSparkle(context, nockX + 11, 18, 7 + readyPulse * 4, -options.timeSeconds * 1.1, 0.42 + readyPulse * 0.28);
        }
        context.restore();
      }

      if (recoil > 0.08) {
        setupStroke(context, 6, "#fff2ad", 0.3 * recoil);
        context.beginPath();
        context.moveTo(-62, -30);
        context.bezierCurveTo(-28, -42, 28, -36, 78, -24);
        context.moveTo(-62, 30);
        context.bezierCurveTo(-28, 42, 28, 36, 78, 24);
        context.stroke();
      }

      drawBranchGrip(context);
      context.restore();
      context.globalAlpha = 1;
    }

    function drawBranchLimb(context) {
      strokePath(context, BRANCH_LIMB, "#070707", 24);
      strokePath(context, BRANCH_LIMB, "#9a6236", 11);
      strokePath(context, BRANCH_MARK_TOP, "#070707", 6);
      strokePath(context, BRANCH_MARK_BOTTOM, "#070707", 6);

      context.save();
      context.translate(48, -166);
      context.rotate((-18 * Math.PI) / 180);
      context.scale(0.74, 0.74);
      fillAndStrokePath(context, LEAF_TIP_TOP, "#67dc55", "#070707", 8);
      strokePath(context, new Path2D("M-15 -5 C-10 -25 -4 -43 5 -59"), "#1d421f", 4);
      context.restore();

      context.save();
      context.translate(47, 166);
      context.rotate((18 * Math.PI) / 180);
      context.scale(0.74, 0.74);
      fillAndStrokePath(context, LEAF_TIP_BOTTOM, "#67dc55", "#070707", 8);
      strokePath(context, new Path2D("M-15 5 C-10 25 -4 43 5 59"), "#1d421f", 4);
      context.restore();

      context.fillStyle = "#fff2ad";
      context.globalAlpha = 0.86;
      context.beginPath();
      context.arc(48, -166, 5, 0, Math.PI * 2);
      context.arc(47, 166, 5, 0, Math.PI * 2);
      context.fill();
      context.globalAlpha = 1;
    }

    function drawBowChargeArc(context, draw, fullDraw, timeSeconds) {
      if (draw <= 0.08) return;
      context.save();
      setupStroke(context, 7, "#fff2ad", 0.14 + draw * 0.32);
      context.setLineDash([70 + draw * 330, 430]);
      context.lineDashOffset = 210 - draw * 180;
      context.stroke(BOW_CHARGE_ARC);
      context.restore();
      if (draw < 1) return;
      context.save();
      setupStroke(context, 5, "#fff2ad", 0.16 + fullDraw * 0.34);
      context.setLineDash([42, 24]);
      context.lineDashOffset = -timeSeconds * 42;
      context.stroke(BOW_CHARGE_ARC);
      context.restore();
    }

    function drawBowString(context, draw, fullDraw) {
      const stringX = 60 - draw * 136;
      const path = cubicPath({ x: 48, y: -166 }, { x: stringX, y: -64 }, { x: stringX, y: 64 }, { x: 47, y: 166 });
      if (draw > 0) strokePath(context, path, "#fff2ad", 9 + draw * 8 + fullDraw * 2, 0.1 + draw * 0.32 + fullDraw * 0.16);
      strokePath(context, path, "#fff2ad", 5.5);
    }

    function drawBranchGrip(context) {
      strokePath(context, BRANCH_GRIP, "#070707", 24);
      strokePath(context, BRANCH_GRIP, "#9a6236", 11);
      strokePath(context, new Path2D("M71 -23 L92 -16 M68 -2 L98 4 M72 21 L92 27"), "#fff2ad", 5.5);
    }

    function drawArrowProjectile(context, x, y, scale, alpha = 1) {
      context.save();
      context.globalAlpha *= alpha;
      context.translate(x, y);
      context.scale(scale, scale);
      setupStroke(context, 14, "#070707");
      context.beginPath();
      context.moveTo(-132, 0);
      context.lineTo(128, 0);
      context.moveTo(128, 0);
      context.lineTo(96, -22);
      context.moveTo(128, 0);
      context.lineTo(96, 22);
      context.stroke();
      setupStroke(context, 7, "#fff2ad");
      context.beginPath();
      context.moveTo(-132, 0);
      context.lineTo(128, 0);
      context.moveTo(128, 0);
      context.lineTo(96, -22);
      context.moveTo(128, 0);
      context.lineTo(96, 22);
      context.stroke();
      fillAndStrokePath(context, ARROW_TAIL_TOP, "#67dc55", "#070707", 8);
      fillAndStrokePath(context, ARROW_TAIL_BOTTOM, "#67dc55", "#070707", 8);
      strokePath(context, ARROW_TAIL_TOP_MARK, "#1d421f", 4);
      strokePath(context, ARROW_TAIL_BOTTOM_MARK, "#1d421f", 4);
      context.fillStyle = "#fff2ad";
      context.globalAlpha *= 0.86;
      context.beginPath();
      context.arc(-132, 0, 5, 0, Math.PI * 2);
      context.fill();
      context.restore();
    }

    function drawSparkle(context, x, y, size, rotation, alpha) {
      context.save();
      context.translate(x, y);
      context.rotate(rotation);
      setupStroke(context, 4, "#070707", alpha * 0.7);
      context.beginPath();
      context.moveTo(-size, 0);
      context.lineTo(size, 0);
      context.moveTo(0, -size);
      context.lineTo(0, size);
      context.stroke();
      setupStroke(context, 2, "#fff2ad", alpha);
      context.beginPath();
      context.moveTo(-size, 0);
      context.lineTo(size, 0);
      context.moveTo(0, -size);
      context.lineTo(0, size);
      context.stroke();
      context.restore();
    }

    function syncInputs() {
      const values = {
        ...state.placement,
        aimDeg: state.preview.aimDeg,
        draw: state.preview.draw,
        recoil: state.preview.recoil
      };

      for (const [key, pair] of Object.entries(fields)) {
        const precision = key === "scale" || key === "draw" || key === "recoil" ? 3 : 1;
        for (const input of pair) input.value = Number(values[key]).toFixed(precision);
      }
    }

    function applyInput(key, value) {
      const next = Number(value);
      if (!Number.isFinite(next)) return;
      if (key === "aimDeg") state.preview.aimDeg = clamp(next, -180, 180);
      else if (key === "draw") state.preview.draw = clamp(next, 0, 1);
      else if (key === "recoil") state.preview.recoil = clamp(next, 0, 1);
      else if (key === "scale") state.placement.scale = clamp(next, 0.08, 0.42);
      else if (key === "distance") state.placement.distance = clamp(next, 0, 95);
      else if (key === "yDistance") state.placement.yDistance = clamp(next, 0, 85);
      else if (key === "offsetX") state.placement.offsetX = clamp(next, -80, 80);
      else if (key === "offsetY") state.placement.offsetY = clamp(next, -80, 60);
      else if (key === "rotationOffsetDeg") state.placement.rotationOffsetDeg = clamp(next, -45, 45);
      syncInputs();
      renderOutput();
    }

    function previewCenter() {
      return { x: canvas.width * 0.49, y: canvas.height * 0.59 };
    }

    function aimVector() {
      const angle = (state.preview.aimDeg * Math.PI) / 180;
      return { x: Math.cos(angle), y: Math.sin(angle), angle };
    }

    function bowLocalPosition() {
      const aim = aimVector();
      return {
        x: state.placement.offsetX + aim.x * state.placement.distance,
        y: state.placement.offsetY + aim.y * state.placement.yDistance
      };
    }

    function drawBodyAndEyes(center, aim) {
      const bodyW = BODY_SIZE.width * BODY_SCALE;
      const bodyH = BODY_SIZE.height * BODY_SCALE;
      ctx.drawImage(bodyImage, -bodyW / 2, BODY_Y - bodyH / 2, bodyW, bodyH);

      for (const eye of Object.values(EYE_TUNING.eyes)) {
        const x = (eye.x - 0.5) * BODY_SIZE.width * BODY_SCALE;
        const y = BODY_Y + (eye.y - 0.5) * BODY_SIZE.height * BODY_SCALE;
        const r = eye.outerRadius * BODY_SIZE.width * BODY_SCALE;
        const whiteR = r * eye.whiteRatio;
        const pupilR = whiteR * eye.pupilRatio;
        const len = Math.hypot(aim.x, aim.y);
        const scale = len > 1 ? 1 / len : 1;

        ctx.fillStyle = "#090b08";
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f7f2df";
        ctx.beginPath();
        ctx.arc(x, y, whiteR, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#151510";
        ctx.beginPath();
        ctx.arc(
          x + aim.x * scale * r * 2 * EYE_TUNING.pupilOffsetScale.x,
          y + aim.y * scale * r * 2 * EYE_TUNING.pupilOffsetScale.y,
          pupilR,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }
    }

    function renderOutput() {
      const params = {
        texture: { ...BOW_TEXTURE },
        placement: {
          scale: round(state.placement.scale),
          distance: round(state.placement.distance),
          yDistance: round(state.placement.yDistance),
          offsetX: round(state.placement.offsetX),
          offsetY: round(state.placement.offsetY),
          rotationOffsetDeg: round(state.placement.rotationOffsetDeg),
          drawDistance: state.placement.drawDistance,
          releaseKick: state.placement.releaseKick,
          recoilDistance: state.placement.recoilDistance,
          recoilY: state.placement.recoilY
        }
      };

      outputEl.value = `const BOWBERT_BRANCH_BOW_TUNING = ${JSON.stringify(params, null, 2)};`;
    }

    function render(timeMs = 0) {
      const timeSeconds = timeMs / 1000;
      const center = previewCenter();
      const aim = aimVector();
      const bowPos = bowLocalPosition();

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#142018";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 24) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 24) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
      ctx.restore();

      drawProceduralBranchBow(bowCtx, {
        draw: state.preview.draw,
        recoil: state.preview.recoil,
        timeSeconds,
        showArrow: true
      });

      ctx.save();
      ctx.translate(center.x, center.y);
      ctx.scale(PREVIEW_ZOOM, PREVIEW_ZOOM);

      ctx.save();
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = "#07120d";
      ctx.beginPath();
      ctx.ellipse(0, 25, 32, 9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      drawBodyAndEyes(center, aim);

      ctx.save();
      ctx.translate(bowPos.x, bowPos.y);
      ctx.rotate(aim.angle + (state.placement.rotationOffsetDeg * Math.PI) / 180);
      ctx.scale(state.placement.scale, state.placement.scale);
      ctx.drawImage(bowCanvas, -BOW_TEXTURE.anchorX, -BOW_TEXTURE.anchorY);
      ctx.restore();

      ctx.restore();

      ctx.save();
      ctx.translate(center.x + bowPos.x * PREVIEW_ZOOM, center.y + bowPos.y * PREVIEW_ZOOM);
      ctx.fillStyle = "#f0c45b";
      ctx.strokeStyle = "#101610";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      requestAnimationFrame(render);
    }

    function pointToLocal(event) {
      const rect = canvas.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * canvas.width;
      const y = ((event.clientY - rect.top) / rect.height) * canvas.height;
      const center = previewCenter();
      return {
        x: (x - center.x) / PREVIEW_ZOOM,
        y: (y - center.y) / PREVIEW_ZOOM
      };
    }

    canvas.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      const local = pointToLocal(event);
      const bow = bowLocalPosition();
      drag = {
        startX: local.x,
        startY: local.y,
        offsetX: state.placement.offsetX,
        offsetY: state.placement.offsetY,
        active: Math.hypot(local.x - bow.x, local.y - bow.y) < 42
      };
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!drag || !drag.active) return;
      event.preventDefault();
      const local = pointToLocal(event);
      state.placement.offsetX = clamp(drag.offsetX + local.x - drag.startX, -80, 80);
      state.placement.offsetY = clamp(drag.offsetY + local.y - drag.startY, -80, 60);
      syncInputs();
      renderOutput();
    });

    canvas.addEventListener("pointerup", (event) => {
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      drag = null;
    });

    canvas.addEventListener("pointercancel", (event) => {
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      drag = null;
    });

    for (const [key, pair] of Object.entries(fields)) {
      for (const input of pair) input.addEventListener("input", () => applyInput(key, input.value));
    }

    document.getElementById("aim-left").addEventListener("click", () => {
      state.preview.aimDeg = 180;
      syncInputs();
      renderOutput();
    });

    document.getElementById("aim-right").addEventListener("click", () => {
      state.preview.aimDeg = 0;
      syncInputs();
      renderOutput();
    });

    document.getElementById("reset").addEventListener("click", () => {
      const fresh = structuredClone(initialState);
      state.placement = fresh.placement;
      state.preview = fresh.preview;
      syncInputs();
      renderOutput();
    });

    document.getElementById("copy").addEventListener("click", async () => {
      outputEl.select();
      try {
        await navigator.clipboard.writeText(outputEl.value);
      } catch (error) {
        document.execCommand("copy");
      }
      window.clearTimeout(statusTimer);
      statusEl.textContent = "Copied.";
      statusTimer = window.setTimeout(() => {
        statusEl.textContent = "";
      }, 1600);
    });

    function init() {
      syncInputs();
      renderOutput();
      requestAnimationFrame(render);
    }

    if (bodyImage.complete) init();
    else bodyImage.addEventListener("load", init);
  </script>
</body>
</html>
