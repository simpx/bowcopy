<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bowbert Comparison</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        --bg: #07110c;
        --panel: #101c14;
        --line: #2e4a37;
        --text: #f7f1d0;
        --accent: #ffd75d;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      main {
        width: 1100px;
        height: 470px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        background: var(--line);
      }

      section {
        display: grid;
        grid-template-rows: auto 1fr;
        place-items: center;
        background: var(--panel);
        padding: 16px;
      }

      h2 {
        justify-self: start;
        margin: 0;
        color: var(--accent);
        font-size: 18px;
        letter-spacing: 0;
      }

      img {
        max-width: 92%;
        max-height: 360px;
        object-fit: contain;
        filter: drop-shadow(0 12px 0 rgb(0 0 0 / 18%));
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h2>Reference</h2>
        <img src="../assets/characters/bowbert/source/reference-01.png" alt="Bowbert reference" />
      </section>
      <section>
        <h2>Previous Runtime Name</h2>
        <img src="../assets/characters/bowbert/bowbert-base-ai-v2-eye-whites.png" alt="Previous Bowbert runtime file" />
      </section>
      <section>
        <h2>Accepted base.png</h2>
        <img src="../assets/characters/bowbert/base.png" alt="Accepted Bowbert base" />
      </section>
    </main>
  </body>
</html>
