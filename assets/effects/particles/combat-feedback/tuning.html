<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Combat Feedback Tuning</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07110c;
        --panel: #101c14;
        --line: #2e4a37;
        --text: #f7f1d0;
        --muted: #b8c8ae;
        --accent: #ffd75d;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(rgba(255,255,255,.034) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.034) 1px, transparent 1px),
          var(--bg);
        background-size: 44px 44px;
        color: var(--text);
      }
      main { width: min(1280px, calc(100vw - 24px)); margin: 0 auto; padding: 22px 0 38px; }
      header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 18px;
        margin-bottom: 14px;
      }
      h1 { margin: 0; font-size: clamp(28px, 3vw, 44px); line-height: 1; letter-spacing: 0; }
      a { color: var(--accent); font-weight: 850; text-decoration: none; }
      .summary { color: var(--muted); max-width: 620px; text-align: right; line-height: 1.46; font-size: 14px; }
      .layout {
        display: grid;
        grid-template-columns: minmax(360px, 1.15fr) minmax(320px, .85fr);
        gap: 14px;
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: color-mix(in srgb, var(--panel) 94%, black);
        overflow: hidden;
      }
      .images {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1px;
        background: var(--line);
      }
      .image-cell {
        min-height: 128px;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
        background: #0a1510;
      }
      .image-cell img {
        max-width: 94%;
        max-height: 110px;
        object-fit: contain;
      }
      .label {
        position: absolute;
        left: 8px;
        top: 7px;
        padding: 3px 7px;
        border-radius: 4px;
        color: var(--accent);
        background: rgba(3,8,5,.78);
        font-size: 11px;
        font-weight: 900;
      }
      .canvas-wrap {
        display: grid;
        place-items: center;
        min-height: 430px;
        padding: 14px;
        background: radial-gradient(circle at center, rgba(255,215,93,.08), transparent 48%), #0a1610;
      }
      canvas {
        width: min(100%, 660px);
        max-height: 390px;
        border: 1px solid #223828;
        border-radius: 6px;
        background: #314f39;
      }
      .toolbar, .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid var(--line);
      }
      button, select, input[type="range"] { font: inherit; }
      button, select {
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #112017;
        color: var(--text);
      }
      button { padding: 0 12px; cursor: pointer; font-weight: 800; }
      button.active { border-color: var(--accent); color: #10140b; background: var(--accent); }
      label {
        display: grid;
        gap: 5px;
        min-width: 140px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      pre {
        margin: 0;
        padding: 12px;
        min-height: 560px;
        max-height: 700px;
        overflow: auto;
        color: #dfe8d6;
        background: #08110c;
        font-size: 11px;
        line-height: 1.45;
      }
      @media (max-width: 920px) {
        header, .layout { grid-template-columns: 1fr; }
        .summary { text-align: left; }
      }
      .capture { background: transparent; }
      .capture main { width: 720px; padding: 0; }
      .capture header,
      .capture .images,
      .capture aside,
      .capture .toolbar,
      .capture .controls { display: none; }
      .capture .layout { display: block; }
      .capture .panel { border: 0; border-radius: 0; background: transparent; }
      .capture .canvas-wrap { min-height: 420px; padding: 0; background: transparent; }
      .capture canvas { width: 720px; height: 420px; max-height: none; border: 0; border-radius: 0; }
    </style>
  </head>
  <body>
    <script>
      const loadRig = () => fetch("./rig.json").then((response) => response.json());
      const hexToRgba = (hex, alpha) => {
        const normalized = hex.replace("#", "");
        const value = Number.parseInt(normalized.length === 3
          ? normalized.split("").map((item) => item + item).join("")
          : normalized, 16);
        const r = (value >> 16) & 255;
        const g = (value >> 8) & 255;
        const b = value & 255;
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      };
      const stableNoise = (seed) => {
        const value = Math.sin(seed * 12.9898) * 43758.5453;
        return value - Math.floor(value);
      };
      const drawGrid = (ctx) => {
        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        ctx.fillStyle = "#314f39";
        ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        ctx.strokeStyle = "rgba(7,18,13,.14)";
        ctx.lineWidth = 2;
        ctx.strokeRect(38, 42, ctx.canvas.width - 76, ctx.canvas.height - 84);
        ctx.strokeStyle = "rgba(7,18,13,.12)";
        ctx.lineWidth = 1;
        for (let x = 74; x < ctx.canvas.width; x += 64) {
          ctx.beginPath();
          ctx.moveTo(x - 5, 74);
          ctx.lineTo(x, 84);
          ctx.lineTo(x + 5, 74);
          ctx.stroke();
        }
        for (let y = 96; y < ctx.canvas.height - 50; y += 66) {
          ctx.beginPath();
          ctx.moveTo(78, y);
          ctx.lineTo(88, y + 10);
          ctx.lineTo(98, y);
          ctx.stroke();
        }
      };
      const drawPulse = (ctx, tone, x, y, progress) => {
        const pulse = tone.pulse;
        const eased = 1 - (1 - progress) ** 2;
        const radius = pulse.startRadius + (pulse.endRadius - pulse.startRadius) * eased;
        const alpha = (1 - progress) * 0.82;
        ctx.save();
        ctx.strokeStyle = hexToRgba(tone.color, alpha);
        ctx.fillStyle = hexToRgba(tone.color, alpha * 0.16);
        ctx.lineWidth = pulse.lineWidth * (1 - progress * 0.35);
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, radius * 0.38, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      };
      const drawParticles = (ctx, tone, x, y, progress, seedBase = 0, direction = { x: 1, y: 0 }) => {
        const particles = tone.particles;
        const colors = particles.colors;
        for (let index = 0; index < particles.count; index += 1) {
          const seed = seedBase + index * 19;
          const angle = particles.directional
            ? Math.atan2(-direction.y, -direction.x) + (stableNoise(seed + 3) - 0.5) * 1.44
            : stableNoise(seed + 3) * Math.PI * 2;
          const speed = particles.minSpeed + stableNoise(seed + 7) * (particles.maxSpeed - particles.minSpeed);
          const distance = speed * 0.0046 * progress * 100;
          const gravity = progress * progress * 22;
          const startX = particles.directional ? -direction.x * (6 + stableNoise(seed + 9) * 20) : (stableNoise(seed + 9) - 0.5) * 8;
          const startY = particles.directional ? -direction.y * (6 + stableNoise(seed + 11) * 20) - 8 : (stableNoise(seed + 11) - 0.5) * 8;
          const color = colors[index % colors.length];
          const radius = particles.radius * (0.55 + stableNoise(seed + 13) * 0.45) * (1 - progress * 0.42);
          ctx.fillStyle = hexToRgba(color, (1 - progress) * 0.86);
          ctx.beginPath();
          ctx.arc(
            x + startX + Math.cos(angle) * distance,
            y + startY + Math.sin(angle) * distance + gravity,
            Math.max(0.5, radius),
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      };
      const drawLabel = (ctx, tone, x, y, progress) => {
        const lift = 1 - (1 - progress) ** 2;
        const size = tone.label === "Room clear" ? 28 : 20;
        ctx.save();
        ctx.globalAlpha = 1 - progress;
        ctx.translate(x, y - lift * 32);
        ctx.scale(1 + Math.sin(lift * Math.PI) * 0.1, 1 + Math.sin(lift * Math.PI) * 0.1);
        ctx.font = `900 ${size}px Inter, system-ui, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineWidth = tone.label === "Room clear" ? 6 : 5;
        ctx.strokeStyle = "#07120d";
        ctx.fillStyle = tone.textColor;
        ctx.strokeText(tone.label, 0, 0);
        ctx.fillText(tone.label, 0, 0);
        ctx.restore();
      };
      const drawRoomClear = (ctx, rig, progress) => {
        const tone = rig.tones.clear;
        const bounds = { x: 72, y: 68, width: 576, height: 284 };
        const inset = 20 * (1 - progress);
        ctx.save();
        ctx.strokeStyle = hexToRgba(tone.color, (1 - progress) * 0.32);
        ctx.fillStyle = hexToRgba(tone.color, (1 - progress) * 0.058);
        ctx.lineWidth = 5;
        ctx.fillRect(bounds.x, bounds.y, bounds.width, bounds.height);
        ctx.strokeRect(bounds.x + inset, bounds.y + inset, bounds.width - inset * 2, bounds.height - inset * 2);
        ctx.restore();
        drawPulse(ctx, tone, 360, 212, progress);
        drawParticles(ctx, tone, 360, 212, progress, 700);
        drawLabel(ctx, tone, 360, 132, progress * 0.68);
      };
      const drawSingle = (ctx, rig, mode, progress) => {
        const x = mode === "combo" ? 0 : ctx.canvas.width / 2;
        const y = ctx.canvas.height / 2;
        if (mode === "clear") {
          drawRoomClear(ctx, rig, progress);
          return;
        }
        if (mode === "combo") {
          const entries = [
            ["spawn", 185, 138],
            ["hit", 336, 168],
            ["death", 486, 138],
            ["dodge", 250, 288],
            ["damage", 450, 288]
          ];
          entries.forEach(([toneName, px, py], index) => {
            const tone = rig.tones[toneName];
            const localProgress = Math.min(0.92, Math.max(0.08, progress + (index - 2) * 0.035));
            drawPulse(ctx, tone, px, py, localProgress);
            drawParticles(ctx, tone, px, py, localProgress, 100 + index * 100, { x: 1, y: 0.15 });
            drawLabel(ctx, tone, px, py - 34, localProgress);
          });
          return;
        }
        const tone = rig.tones[mode];
        drawPulse(ctx, tone, x, y, progress);
        drawParticles(ctx, tone, x, y, progress, 500, { x: 1, y: 0.2 });
        drawLabel(ctx, tone, x, y - 42, progress);
      };
      const drawPreview = (ctx, rig, controls, time) => {
        const mode = controls.mode.value;
        const progress = controls.progress.value === "auto"
          ? (Math.sin(time * 0.002) + 1) / 2
          : Number(controls.progress.value);
        drawGrid(ctx);
        drawSingle(ctx, rig, mode, progress);
        ctx.fillStyle = "rgba(5,10,7,.74)";
        ctx.fillRect(10, 10, 226, 42);
        ctx.fillStyle = "#ffd75d";
        ctx.font = "800 13px system-ui";
        ctx.fillText(`${mode} / ${Math.round(progress * 100)}%`, 20, 36);
      };
      const createImageCell = (label, src, alt) => {
        const cell = document.createElement("div");
        cell.className = "image-cell";
        cell.innerHTML = `<span class="label"></span><img alt="">`;
        cell.querySelector(".label").textContent = label;
        const image = cell.querySelector("img");
        image.src = src;
        image.alt = alt;
        return cell;
      };
      const renderPage = async () => {
        const rig = await loadRig();
        const params = new URLSearchParams(window.location.search);
        if (params.get("capture") === "1") document.body.classList.add("capture");
        document.title = "Combat Feedback Tuning";
        document.body.innerHTML = `
          <main>
            <header>
              <h1>Combat Feedback</h1>
              <div class="summary">Previews shared pulse rings, labels, particles, dodge, damage, and room-clear feedback from this folder's rig.json.<br><a href="../../">particles</a> / <a href="../../../">effects</a></div>
            </header>
            <div class="layout">
              <section class="panel">
                <div class="images" id="images"></div>
                <div class="canvas-wrap"><canvas width="720" height="420"></canvas></div>
                <div class="toolbar">
                  <button type="button" data-mode="hit" class="active">hit</button>
                  <button type="button" data-mode="death">death</button>
                  <button type="button" data-mode="dodge">dodge</button>
                  <button type="button" data-mode="damage">damage</button>
                  <button type="button" data-mode="clear">clear</button>
                  <button type="button" data-mode="combo">combo</button>
                </div>
                <div class="controls">
                  <label>progress<select data-control="progress">
                    <option value="auto">auto</option>
                    <option value="0.2">20%</option>
                    <option value="0.52">52%</option>
                    <option value="0.82">82%</option>
                  </select></label>
                  <label>mode<select data-control="mode">
                    <option value="hit">hit</option>
                    <option value="death">death</option>
                    <option value="dodge">dodge</option>
                    <option value="damage">damage</option>
                    <option value="clear">clear</option>
                    <option value="combo">combo</option>
                  </select></label>
                </div>
              </section>
              <aside class="panel">
                <div class="toolbar" style="border-top:0">
                  <button type="button" data-action="copy-rig">copy rig</button>
                  <button type="button" data-action="copy-preview">copy preview</button>
                </div>
                <pre></pre>
              </aside>
            </div>
          </main>
        `;
        const images = document.querySelector("#images");
        for (const [label, src] of Object.entries(rig.exports ?? {})) {
          if (label === "comparison") continue;
          images.append(createImageCell(label, src, label));
        }
        const controls = {
          progress: document.querySelector('[data-control="progress"]'),
          mode: document.querySelector('[data-control="mode"]')
        };
        const captureMode = params.get("mode");
        if (captureMode && Array.from(controls.mode.options).some((option) => option.value === captureMode)) {
          controls.mode.value = captureMode;
        }
        const captureProgress = params.get("progress");
        if (captureProgress) controls.progress.value = captureProgress;
        const pre = document.querySelector("pre");
        const syncPre = () => {
          pre.textContent = JSON.stringify({
            id: rig.id,
            preview: {
              mode: controls.mode.value,
              progress: controls.progress.value
            },
            rig
          }, null, 2);
        };
        for (const control of Object.values(controls)) {
          control.addEventListener("input", syncPre);
          control.addEventListener("change", syncPre);
        }
        for (const button of document.querySelectorAll("[data-mode]")) {
          button.addEventListener("click", () => {
            document.querySelectorAll("[data-mode]").forEach((item) => item.classList.remove("active"));
            button.classList.add("active");
            controls.mode.value = button.dataset.mode;
            syncPre();
          });
        }
        document.querySelector('[data-action="copy-rig"]').addEventListener("click", async () => {
          await navigator.clipboard.writeText(JSON.stringify(rig, null, 2));
        });
        document.querySelector('[data-action="copy-preview"]').addEventListener("click", async () => {
          await navigator.clipboard.writeText(pre.textContent);
        });
        syncPre();
        const ctx = document.querySelector("canvas").getContext("2d");
        const tick = (time) => {
          drawPreview(ctx, rig, controls, time);
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      };
      renderPage().catch((error) => {
        document.body.innerHTML = `<main><h1>Tuning failed</h1><pre>${String(error.stack ?? error)}</pre></main>`;
      });
    </script>
  </body>
</html>
