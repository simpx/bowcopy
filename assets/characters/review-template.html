<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__ROLE_AUDIT_TITLE__</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07110c;
        --panel: #102016;
        --panel-2: #14291d;
        --ink: #fff6c8;
        --muted: #b9caa5;
        --line: #2c4935;
        --accent: #e9cf6f;
        --danger: #ef7b62;
        --ok: #70d493;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        overflow-x: hidden;
        background: var(--bg);
        color: var(--ink);
      }

      body {
        user-select: none;
        -webkit-user-select: none;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      input,
      textarea {
        user-select: text;
        -webkit-user-select: text;
      }

      button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #163321;
        color: var(--ink);
        cursor: pointer;
        font-weight: 850;
      }

      button:hover { border-color: var(--accent); }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      img {
        display: block;
        max-width: 100%;
        user-select: none;
        -webkit-user-drag: none;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--line);
        background: rgb(7 17 12 / 94%);
        backdrop-filter: blur(10px);
      }

      .shell {
        width: min(1460px, calc(100% - 28px));
        margin: 0 auto;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: end;
        padding: 18px 0 12px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(24px, 4vw, 36px);
        line-height: 1;
        letter-spacing: 0;
      }

      .sub {
        margin-top: 7px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(210px, 1fr) auto auto;
        gap: 10px;
        align-items: center;
        padding: 0 0 14px;
      }

      .search {
        min-height: 38px;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 12px;
        background: #081a10;
        color: var(--ink);
      }

      .toggle {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        min-height: 38px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .toggle input {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }

      main {
        display: grid;
        gap: 16px;
        padding: 16px 0 32px;
      }

      .character-card {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.75fr);
        gap: 14px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .character-card.is-commented {
        border-color: rgb(233 207 111 / 72%);
        box-shadow: 0 0 0 1px rgb(233 207 111 / 16%);
      }

      .character-head {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: start;
        padding-bottom: 10px;
        border-bottom: 1px solid rgb(255 255 255 / 8%);
      }

      .title-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .title-row h2 {
        font-size: clamp(18px, 2.2vw, 24px);
        line-height: 1.15;
        letter-spacing: 0;
      }

      .pill {
        display: inline-flex;
        min-height: 24px;
        align-items: center;
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 999px;
        padding: 0 8px;
        color: var(--muted);
        background: rgb(0 0 0 / 16%);
        font-size: 12px;
        font-weight: 850;
        line-height: 1;
      }

      .pill.status {
        color: var(--ok);
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .links a,
      .links button {
        display: inline-flex;
        min-height: 32px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 10px;
        background: #102a1a;
        color: var(--ink);
        font-size: 12px;
        font-weight: 850;
      }

      .media-main,
      .media-side,
      .review-box,
      .prompt-panel {
        min-width: 0;
      }

      .media-main {
        grid-column: 1;
        grid-row: 2 / span 2;
        align-self: start;
      }

      .media-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 10px;
      }

      .media-side {
        grid-column: 2;
        grid-row: 3;
        display: grid;
        gap: 10px;
        align-content: start;
      }

      .review-box {
        grid-column: 2;
        grid-row: 2;
      }

      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 8%);
        border-radius: 8px;
        background:
          repeating-linear-gradient(0deg, transparent 0 39px, rgb(255 255 255 / 4%) 40px 41px),
          repeating-linear-gradient(90deg, transparent 0 39px, rgb(255 255 255 / 4%) 40px 41px),
          #17271c;
      }

      figure a {
        display: grid;
        min-height: 180px;
        place-items: center;
      }

      .media-main figure a {
        min-height: 320px;
      }

      figure img {
        width: 100%;
        max-height: 520px;
        object-fit: contain;
      }

      .media-main figure img {
        max-height: 620px;
      }

      .media-side figure img {
        max-height: 270px;
      }

      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        border-top: 1px solid rgb(255 255 255 / 8%);
        color: var(--muted);
        background: rgb(0 0 0 / 20%);
        font-size: 12px;
        font-weight: 850;
      }

      .review-box {
        display: grid;
        gap: 10px;
        align-content: start;
      }

      .open-items {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .open-items strong {
        color: var(--ink);
      }

      .open-items ul {
        margin: 0;
        padding-left: 18px;
      }

      .quick-row {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .quick-row button {
        min-height: 30px;
        padding: 0 8px;
        color: var(--muted);
        background: #0d2115;
        font-size: 12px;
      }

      .live-demos {
        display: grid;
        gap: 8px;
      }

      .live-demos strong {
        color: var(--ink);
        font-size: 13px;
      }

      .live-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .live-actions button,
      .live-actions a {
        display: inline-flex;
        min-height: 30px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 8px;
        background: #0d2115;
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
      }

      .live-frame-wrap {
        display: none;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 8px;
        background: #020604;
      }

      .live-frame-wrap.is-loaded {
        display: block;
      }

      .live-frame {
        display: block;
        width: 100%;
        height: min(50vw, 420px);
        min-height: 260px;
        border: 0;
        background: #020604;
      }

      .comment-area {
        width: 100%;
        min-height: 128px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        background: #07110c;
        color: var(--ink);
        line-height: 1.45;
      }

      .comment-area:focus {
        outline: 2px solid rgb(233 207 111 / 36%);
        border-color: var(--accent);
      }

      .card-meta {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
        white-space: pre-wrap;
      }

      .prompt-panel {
        display: grid;
        gap: 10px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-2);
      }

      .prompt-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
      }

      .prompt-head h2 {
        font-size: 19px;
      }

      #promptOutput {
        width: 100%;
        min-height: 260px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: #07110c;
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
      }

      .empty {
        display: none;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--muted);
        background: var(--panel);
      }

      .empty.is-visible {
        display: block;
      }

      @media (max-width: 980px) {
        .topbar,
        .toolbar,
        .character-card,
        .character-head,
        .prompt-head {
          grid-template-columns: 1fr;
        }

        .media-main,
        .media-side,
        .review-box {
          grid-column: auto;
          grid-row: auto;
        }

        .links {
          justify-content: flex-start;
        }

        .media-main figure a {
          min-height: 220px;
        }
      }

      @media (max-width: 520px) {
        .shell {
          width: min(100% - 20px, 1460px);
        }

        .character-card {
          padding: 10px;
        }

        figure a,
        .media-main figure a {
          min-height: 170px;
        }

        .topbar {
          padding-top: 14px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="shell">
        <div class="topbar">
          <div>
            <h1>Bowbert Character Review</h1>
            <p class="sub" id="summaryText">Loading characters...</p>
          </div>
          <button id="copyTop" type="button">复制 Prompt</button>
        </div>
        <div class="toolbar">
          <input id="searchInput" class="search" type="search" placeholder="搜索角色、状态、类型" />
          <label class="toggle">
            <input id="commentedOnly" type="checkbox" />
            只看有评论
          </label>
          <button id="clearSearch" type="button">清空搜索</button>
        </div>
      </div>
    </header>

    <main class="shell">
      <section id="characterList"></section>
      <div id="emptyState" class="empty">没有匹配的角色。</div>

      <section class="prompt-panel">
        <div class="prompt-head">
          <div>
            <h2>Review Prompt</h2>
            <p class="sub">这里只包含已经填写评论的角色。评论会保存在这个页面的浏览器 localStorage。</p>
          </div>
          <button id="copyBottom" type="button">复制 Prompt</button>
        </div>
        <textarea id="promptOutput" spellcheck="false"></textarea>
      </section>
    </main>

    <script>
      const REVIEW_DATA = __ROLE_AUDIT_DATA__;
      const STORAGE_KEY = "bowbert.character-review.comments.v1";
      const QUICK_COMMENTS = [
        ["OK", "OK, 这个角色设定和当前资产可以确认。"],
        ["不像原版", "不像原版参考，需要重新生成 base，优先保留轮廓、配色和涂鸦边线。"],
        ["眼神", "眼神不对，需要调整 runtime gaze 的位置、大小、角度或情绪。"],
        ["比例", "进游戏后比例不对，需要调整 scale、anchor、offset、hitbox 或 shadow。"],
        ["动作", "动作感觉不对，需要调整 idle/walk/attack/hit 的 motion 参数。"]
      ];

      const $ = (id) => document.getElementById(id);
      const roles = REVIEW_DATA.roles || [];

      const loadComments = () => {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        } catch {
          return {};
        }
      };

      let comments = loadComments();

      const saveComments = () => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(comments, null, 2));
      };

      const text = (value, fallback = "") => {
        if (value === undefined || value === null || value === "") {
          return fallback;
        }
        return String(value);
      };

      const mediaLabel = (media) => text(media.label || media.name || media.id, "Media");

      const makePath = (path) => path ? `assets/characters/${path}` : "";

      const appendText = (textarea, value) => {
        const current = textarea.value.trim();
        textarea.value = current ? `${current}\n${value}` : value;
        textarea.dispatchEvent(new Event("input", { bubbles: true }));
        textarea.focus();
      };

      const createFigure = (media) => {
        const figure = document.createElement("figure");
        const link = document.createElement("a");
        const image = document.createElement("img");
        const caption = document.createElement("figcaption");
        const label = document.createElement("span");
        const path = document.createElement("span");

        link.href = media.image;
        link.target = "_blank";
        link.rel = "noreferrer";

        image.src = media.image;
        image.alt = mediaLabel(media);
        image.loading = "lazy";

        label.textContent = mediaLabel(media);
        path.textContent = media.image;

        link.append(image);
        caption.append(label, path);
        figure.append(link, caption);
        return figure;
      };

      const createCharacterCard = (role) => {
        const card = document.createElement("article");
        card.className = "character-card";
        card.dataset.roleId = role.id;
        card.dataset.search = [
          role.id,
          role.name,
          role.kind,
          role.status,
          role.source
        ].map((item) => text(item).toLowerCase()).join(" ");

        const head = document.createElement("div");
        head.className = "character-head";

        const titleWrap = document.createElement("div");
        const titleRow = document.createElement("div");
        titleRow.className = "title-row";

        const title = document.createElement("h2");
        title.textContent = role.name || role.id;
        titleRow.append(title);

        [role.id, role.kind, role.status].forEach((item, index) => {
          const pill = document.createElement("span");
          pill.className = index === 2 ? "pill status" : "pill";
          pill.textContent = text(item, "unknown");
          titleRow.append(pill);
        });

        const sub = document.createElement("p");
        sub.className = "sub";
        sub.textContent = role.source ? makePath(role.source) : "No rig path";
        titleWrap.append(titleRow, sub);

        const links = document.createElement("div");
        links.className = "links";

        [
          ["Tuning", role.tuning],
          ["Rig", role.source],
          ["Brief", role.brief]
        ].forEach(([labelText, href]) => {
          if (!href) {
            return;
          }
          const link = document.createElement("a");
          link.href = href;
          link.target = "_blank";
          link.rel = "noreferrer";
          link.textContent = labelText;
          links.append(link);
        });

        const jumpButton = document.createElement("button");
        jumpButton.type = "button";
        jumpButton.textContent = "跳到 Prompt";
        jumpButton.addEventListener("click", () => {
          $("promptOutput").scrollIntoView({ behavior: "smooth", block: "start" });
        });
        links.append(jumpButton);

        head.append(titleWrap, links);

        const allMedia = Array.isArray(role.media) ? role.media.filter((item) => item.image) : [];
        const comparison = allMedia.find((item) => item.id === "comparison") || allMedia[0];
        const sideMedia = allMedia.filter((item) => item !== comparison);

        const mediaMain = document.createElement("div");
        mediaMain.className = "media-main";
        if (comparison) {
          mediaMain.append(createFigure(comparison));
        }

        const side = document.createElement("div");
        side.className = "media-side";
        sideMedia.forEach((media) => side.append(createFigure(media)));

        const review = document.createElement("div");
        review.className = "review-box";

        const liveDemos = document.createElement("div");
        liveDemos.className = "live-demos";
        const demos = Array.isArray(role.liveDemos) ? role.liveDemos : [];
        if (demos.length) {
          const liveTitle = document.createElement("strong");
          liveTitle.textContent = "Live Demo";
          const actionRow = document.createElement("div");
          actionRow.className = "live-actions";
          const frameWrap = document.createElement("div");
          frameWrap.className = "live-frame-wrap";
          const frame = document.createElement("iframe");
          frame.className = "live-frame";
          frame.title = `${role.name || role.id} live demo`;
          frame.loading = "lazy";

          demos.forEach((demo) => {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = demo.label || demo.id || "Live";
            button.addEventListener("click", () => {
              frame.src = demo.url;
              frameWrap.classList.add("is-loaded");
            });
            const link = document.createElement("a");
            link.href = demo.url;
            link.target = "_blank";
            link.rel = "noreferrer";
            link.textContent = "打开";
            actionRow.append(button, link);
          });

          frameWrap.append(frame);
          liveDemos.append(liveTitle, actionRow, frameWrap);
        }

        const openItems = document.createElement("div");
        openItems.className = "open-items";
        const openItemsTitle = document.createElement("strong");
        openItemsTitle.textContent = "Open Items";
        openItems.append(openItemsTitle);
        const list = document.createElement("ul");
        (role.openItems || ["No open items recorded."]).forEach((item) => {
          const li = document.createElement("li");
          li.textContent = item;
          list.append(li);
        });
        openItems.append(list);

        const quickRow = document.createElement("div");
        quickRow.className = "quick-row";

        const textarea = document.createElement("textarea");
        textarea.className = "comment-area";
        textarea.placeholder = "写这个角色的问题、确认意见或要改的方向。比如：base 像了，但 runtime 眼神太小；进游戏后阴影太远。";
        textarea.value = comments[role.id] || "";

        QUICK_COMMENTS.forEach(([labelText, value]) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = labelText;
          button.addEventListener("click", () => appendText(textarea, value));
          quickRow.append(button);
        });

        textarea.addEventListener("input", () => {
          const value = textarea.value.trim();
          if (value) {
            comments[role.id] = value;
            card.classList.add("is-commented");
          } else {
            delete comments[role.id];
            card.classList.remove("is-commented");
          }
          saveComments();
          renderPrompt();
          applyFilters();
        });

        if (textarea.value.trim()) {
          card.classList.add("is-commented");
        }

        const meta = document.createElement("div");
        meta.className = "card-meta";
        const mediaPaths = allMedia.map((item) => makePath(item.image)).join("\n");
        meta.textContent = [
          `Folder: assets/characters/${role.id}`,
          `Tuning: ${makePath(role.tuning)}`,
          `Media:\n${mediaPaths}`
        ].join("\n");

        review.append(liveDemos, openItems, quickRow, textarea, meta);
        card.append(head, mediaMain, review, side);
        return card;
      };

      const commentedRoles = () => roles.filter((role) => text(comments[role.id]).trim());

      const buildPrompt = () => {
        const selected = commentedRoles();
        const lines = [
          "你是 Bowbert 项目的 character studio 助手。",
          "请根据下面的角色 review 评论修改对应 assets/characters 子目录和 runtime rig。",
          "",
          "硬约束：",
          "- 只处理有评论的角色；评论为 OK 或确认时不要修改该角色。",
          "- base 图、附件、runtime gaze、motion、shadow、hitbox、tuning 页面要保持同一套管线。",
          "- 修改后请更新对应 tuning.html 或截图验证，并说明哪些文件改变了。",
          "- 不要回退无关角色或无关 runtime 改动。",
          "",
          `Review source: assets/characters/review.html`,
          `Manifest: assets/characters/review-manifest.json`,
          ""
        ];

        if (!selected.length) {
          lines.push("当前还没有填写任何角色评论。");
          return lines.join("\n");
        }

        lines.push("角色评论：");
        selected.forEach((role, index) => {
          const roleMedia = Array.isArray(role.media) ? role.media : [];
          lines.push("");
          lines.push(`${index + 1}. [${role.id}] ${role.name || role.id}`);
          lines.push(`Kind: ${text(role.kind, "unknown")}`);
          lines.push(`Status: ${text(role.status, "unknown")}`);
          lines.push(`Rig: ${makePath(role.source)}`);
          lines.push(`Tuning: ${makePath(role.tuning)}`);
          roleMedia.forEach((media) => {
            lines.push(`${mediaLabel(media)}: ${makePath(media.image)}`);
          });
          (role.liveDemos || []).forEach((demo) => {
            lines.push(`Live ${demo.label || demo.id}: ${demo.url}`);
          });
          lines.push("Comment:");
          lines.push(text(comments[role.id]).trim());
        });

        return lines.join("\n");
      };

      const renderPrompt = () => {
        const selected = commentedRoles();
        $("promptOutput").value = buildPrompt();
        $("summaryText").textContent = `${roles.length} 个角色，${selected.length} 个已有评论。Generated from ${REVIEW_DATA.manifestPath || "review-manifest.json"}.`;
      };

      const applyFilters = () => {
        const query = $("searchInput").value.trim().toLowerCase();
        const onlyCommented = $("commentedOnly").checked;
        let visible = 0;
        document.querySelectorAll(".character-card").forEach((card) => {
          const roleId = card.dataset.roleId;
          const matchesSearch = !query || card.dataset.search.includes(query);
          const matchesComment = !onlyCommented || Boolean(text(comments[roleId]).trim());
          const shouldShow = matchesSearch && matchesComment;
          card.hidden = !shouldShow;
          if (shouldShow) {
            visible += 1;
          }
        });
        $("emptyState").classList.toggle("is-visible", visible === 0);
      };

      const copyPrompt = async () => {
        renderPrompt();
        $("promptOutput").select();
        try {
          await navigator.clipboard.writeText($("promptOutput").value);
        } catch {
          document.execCommand("copy");
        }
      };

      const init = () => {
        const list = $("characterList");
        roles.forEach((role) => list.append(createCharacterCard(role)));
        renderPrompt();
        applyFilters();

        $("searchInput").addEventListener("input", applyFilters);
        $("commentedOnly").addEventListener("change", applyFilters);
        $("clearSearch").addEventListener("click", () => {
          $("searchInput").value = "";
          $("commentedOnly").checked = false;
          applyFilters();
        });
        $("copyTop").addEventListener("click", copyPrompt);
        $("copyBottom").addEventListener("click", copyPrompt);
      };

      init();
    </script>
  </body>
</html>
