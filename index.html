<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bowbert" />
    <meta name="theme-color" content="#07090f" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Bowbert</title>
  </head>
  <body>
    <div id="app">
      <div id="game-root" aria-label="Bowbert game"></div>
    </div>
    <div id="boot-loading">
      <div id="boot-title">BOWBERT</div>
      <div id="boot-bar"><div id="boot-fill"></div></div>
      <div id="boot-note">正在加载…</div>
    </div>
    <style>
      #boot-loading {
        position: fixed;
        inset: 0;
        z-index: 99;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #07090f;
        transition: opacity 400ms ease;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #boot-loading.done { opacity: 0; pointer-events: none; }
      #boot-title { color: #f0e4ff; font-size: 26px; font-weight: 900; letter-spacing: 0.35em; }
      #boot-bar {
        width: min(60vw, 300px);
        height: 10px;
        border-radius: 999px;
        border: 2px solid #1e3324;
        background: #0d1610;
        overflow: hidden;
      }
      #boot-fill {
        width: 4%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(180deg, #ffd75d, #c68a2a);
        transition: width 200ms ease;
        animation: boot-pulse 1.2s ease-in-out infinite alternate;
      }
      #boot-fill.tracking { animation: none; }
      #boot-note { color: #8faa96; font-size: 12px; letter-spacing: 0.15em; }
      @keyframes boot-pulse { from { opacity: 0.55; } to { opacity: 1; } }
    </style>
    <script>
      // Live before the JS bundle arrives; the game updates it during preload.
      (function () {
        var lastProgressAt = Date.now();
        var failed = false;

        function note(text) {
          var label = document.getElementById('boot-note');
          if (label) label.textContent = text;
        }

        window.__bootProgress = function (value, phase) {
          lastProgressAt = Date.now();
          if (failed) return;
          var fill = document.getElementById('boot-fill');
          if (fill) {
            fill.classList.add('tracking');
            fill.style.width = Math.round(4 + value * 96) + '%';
          }
          note((phase || '正在加载') + ' ' + Math.round(value * 100) + '%');
        };

        window.__bootDone = function () {
          var el = document.getElementById('boot-loading');
          if (!el) return;
          el.classList.add('done');
          setTimeout(function () {
            el.remove();
          }, 500);
        };

        function offerRetry(reason) {
          if (failed || !document.getElementById('boot-loading')) return;
          failed = true;
          note(reason + ',点击屏幕重试');
          var el = document.getElementById('boot-loading');
          el.style.cursor = 'pointer';
          el.addEventListener('click', function () {
            window.location.reload();
          });
        }

        // A script/asset that dies during boot would otherwise hang forever.
        window.addEventListener(
          'error',
          function (event) {
            if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
              offerRetry('资源加载失败');
            }
          },
          true
        );

        // Watchdog: no progress for a while = stalled network.
        var watchdog = setInterval(function () {
          if (!document.getElementById('boot-loading')) {
            clearInterval(watchdog);
            return;
          }
          if (Date.now() - lastProgressAt > 20000) {
            offerRetry('网络缓慢或中断');
          }
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
